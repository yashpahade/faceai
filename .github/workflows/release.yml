# CD: `git tag v0.2.0 && git push --tags` => image build + GitHub Container Registry pe push.
# Image tag = git tag. Production deploy hamesha ek IMMUTABLE tag se hota hai (`latest` se nahi),
# taaki "kya deployed hai?" ka exact jawab ho aur rollback = purana tag dobara deploy.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write # GHCR push

jobs:
  gate:
    # Release se pehle bhi quality gate: tag kisi bhi commit pe lag sakta hai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[eval]"
      - run: python -m faceai.eval.freshness
      - run: python -m faceai.eval.gate

  image:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
