[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceai"
version = "0.1.0"
description = "Production-style face recognition service with MLOps practices"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# Phase 1 mein yahan ML dependencies aayengi (insightface, onnxruntime-gpu, faiss, opencv)
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------- Ruff: linter + formatter ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear (common bugs)
    "UP",       # pyupgrade (modern syntax)
    "SIM",      # simplifications
]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
