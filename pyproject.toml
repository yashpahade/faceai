[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceai"
version = "0.1.0"
description = "Production-style face recognition service with MLOps practices"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "faiss-cpu==1.11.0",
    "prometheus-client==0.23.1",
]

[project.optional-dependencies]
# ONNX Runtime: ek hi chuno. GPU wala CUDA 12 + cuDNN 9 ke DLLs pip se hi le aata hai.
cpu = ["onnxruntime==1.22.0"]
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.22.0"]
# Offline evaluation pipeline (Phase 2)
# pathspec pinned: dvc 3.59 imports a private name removed in pathspec 1.x
eval = ["dvc==3.59.1", "pathspec==0.12.1", "pyyaml>=6"]
# Experiment tracking + model registry (Phase 3)
mlops = ["mlflow==3.17.2", "pyyaml>=6"]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "pre-commit==4.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------- Ruff: linter + formatter ----------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI ka dependency-injection pattern (Depends/File defaults) intentional hai
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused imports, undefined names)
    "I",        # import sorting
    "B",        # bugbear (common bugs)
    "UP",       # pyupgrade (modern syntax)
    "SIM",      # simplifications
]

# ---------------- Pytest ----------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

# ---------------- Coverage ----------------
[tool.coverage.run]
source = ["faceai"]
# Ye modules asli data/GPU/network ke bina nahi chal sakte (LFW download, GPU embedding, model
# download, server entrypoint). Inhe eval-full workflow + smoke script cover karte hain, unit tests nahi.
omit = [
    "*/faceai/eval/lfw.py",
    "*/faceai/eval/embed.py",
    "*/faceai/models/download.py",
    "*/faceai/__main__.py",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
